{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8>
    <title>{% block title %}Strap & Score{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;

            background-image: url("{% static 'booking/images/turf.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            font-family: 'Orbitron', sans-serif;
            color: white;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        /* LOGOUT BUTTON */
        .logout-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .logout-btn {
            background: #ff5252;
            color: white;
            padding: 10px 22px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    {% if user.is_authenticated %}
        {% block show_logout %}
            <!-- Logout is hidden by default -->
        {% endblock %}
    {% endif %}

    {% block content %}{% endblock %}

</body>
</html>
