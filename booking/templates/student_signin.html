{% extends "base.html" %}

{% block title %}Student Sign In{% endblock %}

{% block content %}

<div class="signin-page">

    <h2>Student Sign In</h2>

    {% if messages %}
    {% for message in messages %}
        <p class="error-msg">{{ message }}</p>
    {% endfor %}
{% endif %}

    <form method="post">
        {% csrf_token %}

        <!-- EMAIL -->
        <input
            type="email"
            name="email"
            placeholder="Enter your registered email ID"
            required
        >

        <!-- PASSWORD -->
        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <!-- SIGN IN BUTTON -->
        <button type="submit" class="nav-btn next">
            Sign In
        </button>
    </form>

    <!-- BACK BUTTON -->
    <a href="/internal/" class="nav-btn back">
        ⬅ Back
    </a>

</div>

{% endblock %}

{% block extra_css %}
<style>

.signin-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.signin-page h2 {
    margin-bottom: 20px;
}

/* FORM */
form {
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* INPUTS */
input {
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 1rem;
}

input::placeholder {
    color: #555;
}

/* BUTTONS */
.nav-btn {
    width: 320px;
    height: 48px;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border: none;
    cursor: pointer;
    margin-top: 10px;
}

/* SIGN IN */
.nav-btn.next {
    background: #00e676;
    color: black;
}

/* BACK */
.nav-btn.back {
    background: #e53935;
    color: white;
}
.error-msg {
    color: #ff5252;
    background: rgba(0,0,0,0.6);
    padding: 10px;
    border-radius: 8px;
    text-align: center;
}


/* MOBILE */
@media (max-width: 400px) {
    form, .nav-btn {
        width: 90%;
    }
}

</style>
{% endblock %}
