{% extends 'base.html' %}

{% block title %}Upload Receipt{% endblock %}

{% block content %}

<div class="receipt-page">

    <h2>Upload Payment Receipt</h2>

    {% if error %}
        <p class="error-text">{{ error }}</p>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Custom Upload Box -->
        <label class="upload-box">
            <input type="file"
                   name="receipt"
                   id="receiptInput"
                   accept="image/*,application/pdf"
                   required>
            <span id="fileText">Click to upload receipt</span>
        </label>

        <!-- Buttons -->
        <div class="btn-group">
            <a href="/external-details/" class="back-btn">⬅ Back</a>

            <button type="submit" class="submit-btn">
                Submit ➡
            </button>
        </div>

    </form>

</div>

<script>
const input = document.getElementById("receiptInput");
const fileText = document.getElementById("fileText");

input.addEventListener("change", () => {
    if (input.files.length > 0) {
        fileText.textContent = input.files[0].name;
    }
});
</script>

{% endblock %}

{% block extra_css %}
<style>

.receipt-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.receipt-page h2 {
    margin-bottom: 20px;
}

.error-text {
    color: #ff5252;
    font-weight: bold;
    margin-bottom: 10px;
}

form {
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* Custom Upload Box */
.upload-box {
    height: 120px;
    border: 2px dashed #00e676;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.9);
    text-align: center;
    font-weight: bold;
    color: #000;
}

.upload-box input {
    display: none;
}

#fileText {
    padding: 10px;
}

/* Buttons */
.btn-group {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.back-btn,
.submit-btn {
    width: 140px;
    height: 46px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    text-decoration: none;
    border: none;
    cursor: pointer;
}

.back-btn {
    background: #e53935;
    color: white;
}

.submit-btn {
    background: #00e676;
    color: black;
}

</style>
{% endblock %}
